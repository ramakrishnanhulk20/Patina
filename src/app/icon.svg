<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Growth rings: a mark that can only form by lasting. Same motif as the
    section labels and the hero background, so the tab icon, the social card and
    the page all read as one thing.
  -->
  <rect width="64" height="64" rx="12" fill="#0B0C0B"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#35E0A1" stroke-width="2" opacity="0.35"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#35E0A1" stroke-width="2" opacity="0.6"/>
  <circle cx="32" cy="32" r="9" fill="none" stroke="#35E0A1" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="3.5" fill="#35E0A1"/>
</svg>
